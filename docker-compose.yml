services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookcatalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookcatalog"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    environment:
      ConnectionStrings__BookCatalog: Host=postgres;Port=5432;Database=bookcatalog;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BookCatalog: Host=postgres;Port=5432;Database=bookcatalog;Username=postgres;Password=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    stop_grace_period: 30s
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  postgres_data:
